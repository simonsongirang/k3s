---
- name: Join the mainframe to the existing k3s cluster as a worker
  hosts: mainframe
  become: true
  gather_facts: true
  vars:
    k3s_version: "{{ lookup('ansible.builtin.env', 'K3S_VERSION') }}"
    k3s_server_url: "{{ lookup('ansible.builtin.env', 'K3S_URL') }}"
    k3s_token: "{{ lookup('ansible.builtin.env', 'K3S_TOKEN') }}"
    k3s_expected_hostname: mainframe
    k3s_expected_node_ip: 10.88.111.24
    k3s_api_lan_cidr: 10.88.111.0/24
    k3s_tailscale_ipv4_cidr: 100.64.0.0/10
    k3s_tailscale_ipv6_cidr: fd7a:115c:a1e0::/48
    k3s_pod_cidr: 10.42.0.0/16
    k3s_service_cidr: 10.43.0.0/16
    k3s_cluster_peer_cidrs:
      - "{{ k3s_api_lan_cidr }}"
      - "{{ k3s_tailscale_ipv4_cidr }}"
      - "{{ k3s_tailscale_ipv6_cidr }}"
  tasks:
    - name: Validate the target host and Infisical secret
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_major_version == "24"
          - ansible_architecture == "x86_64"
          - ansible_hostname == k3s_expected_hostname
          - k3s_expected_node_ip in ansible_all_ipv4_addresses
          - k3s_server_url is match('^https://')
          - k3s_version | length > 0
          - k3s_token | length > 0
        fail_msg: >-
          This playbook requires the mainframe host (hostname mainframe,
          address 10.88.111.24) running Ubuntu 24 on x86_64. Infisical must
          provide K3S_URL, K3S_TOKEN, and K3S_VERSION for the existing cluster.
        quiet: true

    - name: Check for an existing standalone k3s server unit
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s.service
      register: existing_k3s_server_unit

    - name: Refuse to convert a standalone server into a worker automatically
      ansible.builtin.assert:
        that:
          - not existing_k3s_server_unit.stat.exists
        fail_msg: >-
          A standalone k3s server unit already exists on this host. This playbook
          will not remove its cluster state or convert it to an agent automatically.
          Migrate or clean up that installation deliberately before retrying.
        quiet: true

    - name: Check for an existing k3s agent unit
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s-agent.service
      register: existing_k3s_agent_unit

    - name: Install k3s host dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - iproute2
          - iptables
          - ufw
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Check the UFW firewall state
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: ufw_status
      changed_when: false

    - name: Require UFW to be active before installing k3s
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status.stdout"
          - "'Default: deny (incoming)' in ufw_status.stdout"
          - "'allow (outgoing)' in ufw_status.stdout"
        fail_msg: >-
          UFW must already be active with default-deny incoming and
          allow-outgoing policies. Configure those policies while preserving
          the rules required by the mainframe's other services and SSH.
        quiet: true

    - name: Check that UFW IPv6 filtering is enabled
      ansible.builtin.command:
        argv:
          - grep
          - -Eq
          - ^IPV6=yes$
          - /etc/default/ufw
      register: ufw_ipv6_setting
      changed_when: false
      failed_when: false

    - name: Require UFW IPv6 filtering for Tailscale
      ansible.builtin.assert:
        that:
          - ufw_ipv6_setting.rc == 0
        fail_msg: >-
          Set IPV6=yes in /etc/default/ufw and reload UFW before deploying;
          the Tailscale IPv6 firewall rules need IPv6 filtering enabled.
        quiet: true

    - name: Allow traffic from the cluster pod network
      community.general.ufw:
        rule: allow
        direction: in
        src: "{{ k3s_pod_cidr }}"
        comment: k3s pod network

    - name: Allow traffic from the cluster service network
      community.general.ufw:
        rule: allow
        direction: in
        src: "{{ k3s_service_cidr }}"
        comment: k3s service network

    - name: Allow Flannel VXLAN from cluster peer networks
      community.general.ufw:
        rule: allow
        direction: in
        proto: udp
        port: "8472"
        src: "{{ item }}"
        comment: k3s Flannel VXLAN from cluster peers
      loop: "{{ k3s_cluster_peer_cidrs }}"

    - name: Allow metrics-server traffic from cluster peer networks
      community.general.ufw:
        rule: allow
        direction: in
        proto: tcp
        port: "10250"
        src: "{{ item }}"
        comment: k3s metrics-server from cluster peers
      loop: "{{ k3s_cluster_peer_cidrs }}"

    - name: Allow ingress ports from LAN and Tailscale
      community.general.ufw:
        rule: allow
        direction: in
        proto: tcp
        port: "{{ item.1 }}"
        src: "{{ item.0 }}"
        comment: k3s ingress from LAN and Tailscale
      loop: "{{ k3s_cluster_peer_cidrs | product([80, 443]) | list }}"

    - name: Ensure the k3s agent configuration directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure the k3s agent to join the existing cluster
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          server: {{ k3s_server_url | to_json }}
          token: {{ k3s_token | to_json }}
      no_log: true
      notify: Restart k3s agent

    - name: Ensure the installer directory exists
      ansible.builtin.file:
        path: /usr/local/src
        state: directory
        mode: "0755"

    - name: Download the official k3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/src/k3s-install.sh
        mode: "0755"
        validate_certs: true

    - name: Check the installed k3s version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - --version
      register: installed_k3s
      changed_when: false
      failed_when: false

    - name: Parse the installed k3s version
      ansible.builtin.set_fact:
        installed_k3s_version: >-
          {{ installed_k3s.stdout.split()[2]
             if installed_k3s.rc == 0 and (installed_k3s.stdout.split() | length) >= 3
             else '' }}

    - name: Install or upgrade k3s
      ansible.builtin.command:
        argv:
          - /usr/local/src/k3s-install.sh
      environment:
        INSTALL_K3S_EXEC: agent
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      no_log: true
      when: not existing_k3s_agent_unit.stat.exists or installed_k3s_version != k3s_version

    - name: Ensure the k3s agent service is enabled and running
      ansible.builtin.systemd_service:
        name: k3s-agent
        enabled: true
        state: started

    - name: Wait for the k3s agent service to become active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - k3s-agent
      register: k3s_agent_status
      changed_when: false
      retries: 12
      delay: 5
      until: k3s_agent_status.rc == 0

  handlers:
    - name: Restart k3s agent
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: restarted
